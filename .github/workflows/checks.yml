name: Transcriber checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser/package-lock.json
      - name: Install local media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak
      - name: Install application and test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          npm ci --no-audit --no-fund
      - name: Python checks and durable-job tests
        run: |
          .venv/bin/ruff format --check app.py scripts tests
          .venv/bin/ruff check --select E9,F63,F7,F82 app.py scripts tests
          .venv/bin/python -m pytest -q
      - name: Browser and actual speech model
        run: |
          .venv/bin/python scripts/make_sample.py
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Browser edition production build and real inference
        run: |
          npm ci --prefix browser --no-audit --no-fund
          npm run build --prefix browser
          npx playwright test --config playwright.hosted.config.ts
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transcriber-browser-evidence
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
